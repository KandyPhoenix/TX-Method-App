<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes, maximum-scale=5" />
  <meta name="theme-color" content="#fff7eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Texas Method" />
  <title>Texas Method Trainer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" />
  <link rel="stylesheet" href="styles.css?v=163" />
  <script>
    /* Paint the right theme before first paint — app.js loads at end of body,
       which would otherwise flash dark at a light-theme user on every launch. */
    (function () {
      try {
        var t = localStorage.getItem('tm_theme') || 'light';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#fff7eb' : '#080808');
      } catch (e) {
        /* storage blocked (private mode, site-data off). Bare :root is the
           DARK palette, so pin light explicitly or the fallback contradicts
           the default set above. */
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="stickytop">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">▦</span>
        <div>
          <h1 id="screenTitle">Today</h1>
          <p id="screenSub" class="sub"></p>
          <span class="version-badge">v163 · Aug 31</span>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="equipBtn" class="ghost-btn equip-btn" title="What you are training with today">Gym ⌄</button>
        <button id="profileBtn" class="ghost-btn profile-avatar-btn" title="Switch profile">Me</button>
        <button id="rfresh" class="ghost-btn" title="Jump to current day">⟳</button>
      </div>
    </header>

    <div id="sessBar" class="sess-bar hidden">
      <span class="sess-bar-count"><b id="sessCount">0 / 0</b> sets complete</span>
      <span class="sess-bar-track"><span id="sessFill" class="sess-bar-fill2"></span></span>
      <span class="sess-bar-clock" id="sessClock">0:00</span>
    </div>
    </div>

    <main id="view"><!-- screens render here --></main>

    <nav class="tabbar" role="tablist">
      <button class="tab active" data-tab="today"><span>🗺️</span>Roadmap</button>
      <button class="tab" data-tab="program"><span>📚</span>Protocols</button>
      <button class="tab" data-tab="lib"><span>🔍</span>Library</button>
      <button class="tab" data-tab="stats"><span>📈</span>Stats</button>
      <button class="tab" data-tab="fp"><span>🧬</span>Fingerprint</button>
      <button class="tab" data-tab="guide" hidden><span>📖</span>Guide</button>
      <button class="tab" data-tab="setup"><span>⚙️</span>Setup</button>
    </nav>
  </div>

  <!-- Rest timer — centered card overlay -->
  <div id="restTimer" class="rest-overlay hidden">
    <div class="rest-card">
      <div id="restLabel" class="rest-label">REST</div>
      <div id="restDisplay" class="rest-time">2:00</div>
      <div class="rest-bar-track"><div id="restFill" class="rest-bar-fill"></div></div>
      <div class="rest-card-controls">
        <button id="restMinus" class="rest-ctrl">−15</button>
        <button id="restStop" class="rest-stop">Done</button>
        <button id="restPlus" class="rest-ctrl">+15</button>
      </div>
    </div>
  </div>

  <script src="generator-data.js?v=163"></script>
  <script src="plans-data.js?v=163"></script>
  <script src="app.js?v=163"></script>
</body>
</html>
